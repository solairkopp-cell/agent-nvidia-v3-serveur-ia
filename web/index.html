<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Server – Test Micro/WebSocket</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; max-width: 900px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ddd; background: #f7f7f7; cursor: pointer; }
      button.primary { background: #111827; color: white; border-color: #111827; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; width: 320px; }
      textarea { min-height: 96px; resize: vertical; }
      .card { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-top: 14px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
      .label { color: #6b7280; font-size: 12px; }
      .status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h2>AI Server – Audio 100% WebSocket</h2>
    <div class="row">
      <div>
        <div class="label">WebSocket URL</div>
        <input id="wsUrl" />
      </div>
      <button id="connectBtn" class="primary">Connecter</button>
      <button id="disconnectBtn" disabled>Déconnecter</button>
      <span class="status" id="status">offline</span>
    </div>

    <div class="card">
      <div class="row">
        <button id="startBtn" class="primary" disabled>Démarrer (micro)</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="testTtsBtn" disabled>Test TTS</button>
        <span class="label">Lecture TTS</span>
        <span id="audioState">idle</span>
      </div>
      <div class="row" style="margin-top: 10px;">
        <span class="label">Entrée</span>
        <span id="inputRate">-</span>
        <span class="label">Sortie</span>
        <span id="outputRate">-</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Test rapide</div>
      <div class="mono">1. Connecter
2. Test TTS pour valider la sortie audio WS
3. Démarrer (micro) pour tester le flux entrant + STT</div>
    </div>

    <div class="card">
      <div class="label">Texte Test TTS</div>
      <textarea id="ttsTestText">Bonjour. Ceci est un test du pipeline TTS entier via WebSocket.</textarea>
    </div>

    <div class="card">
      <div class="label">Transcript</div>
      <div id="transcript" class="mono"></div>
    </div>

    <div class="card">
      <div class="label">Intent détecté</div>
      <div id="intent" class="mono"></div>
    </div>

    <div class="card">
      <div class="label">Réponse (stream)</div>
      <div id="response" class="mono"></div>
    </div>

    <div class="card">
      <div class="label">Lecture Test TTS</div>
      <div id="ttsTestLog" class="mono"></div>
    </div>

    <div class="card">
      <div class="label">Logs</div>
      <div id="logs" class="mono"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = (msg) => {
        const el = $("logs");
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
      };

      function defaultWsUrl() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        return `${proto}://${location.host}/ws`;
      }

      $("wsUrl").value = defaultWsUrl();

      let ws = null;
      let sessionStarted = false;
      let micStream = null;
      let captureContext = null;
      let captureSource = null;
      let captureProcessor = null;
      let captureSink = null;
      let playbackContext = null;
      let playbackCursor = 0;
      let outputSampleRate = 48000;
      const playbackSources = new Set();
      let pendingStartPromise = null;
      let resolvePendingStart = null;
      let rejectPendingStart = null;

      function setStatus(text) {
        $("status").textContent = text;
      }

      function setAudioRates({ input = "-", output = "-" } = {}) {
        $("inputRate").textContent = input === "-" ? "-" : `${input} Hz`;
        $("outputRate").textContent = output === "-" ? "-" : `${output} Hz`;
      }

      function setButtons({ connected, started }) {
        $("connectBtn").disabled = connected;
        $("disconnectBtn").disabled = !connected;
        $("startBtn").disabled = !connected || started;
        $("stopBtn").disabled = !connected || !started;
        $("testTtsBtn").disabled = !connected;
      }

      setButtons({ connected: false, started: false });
      setAudioRates();

      function resetPendingStart(error = null) {
        if (error && rejectPendingStart) {
          rejectPendingStart(error);
        }
        pendingStartPromise = null;
        resolvePendingStart = null;
        rejectPendingStart = null;
      }

      async function ensurePlaybackContext() {
        if (playbackContext && playbackContext.sampleRate !== outputSampleRate) {
          try { await playbackContext.close(); } catch {}
          playbackContext = null;
          playbackCursor = 0;
        }
        if (!playbackContext) {
          playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: outputSampleRate });
        }
        if (playbackContext.state === "suspended") {
          await playbackContext.resume();
        }
        if (playbackCursor < playbackContext.currentTime) {
          playbackCursor = playbackContext.currentTime;
        }
      }

      function clearPlayback() {
        for (const source of Array.from(playbackSources)) {
          try { source.stop(0); } catch {}
        }
        playbackSources.clear();
        if (playbackContext) {
          playbackCursor = playbackContext.currentTime;
        } else {
          playbackCursor = 0;
        }
        $("audioState").textContent = "idle";
      }

      function schedulePcmPlayback(arrayBuffer) {
        if (!playbackContext || !(arrayBuffer instanceof ArrayBuffer)) return;

        const pcm = new Int16Array(arrayBuffer);
        if (!pcm.length) return;

        const samples = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i += 1) {
          samples[i] = pcm[i] / 32768;
        }

        const audioBuffer = playbackContext.createBuffer(1, samples.length, outputSampleRate);
        audioBuffer.copyToChannel(samples, 0);

        const source = playbackContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playbackContext.destination);

        const startAt = Math.max(playbackContext.currentTime + 0.03, playbackCursor);
        source.start(startAt);
        playbackCursor = startAt + audioBuffer.duration;
        playbackSources.add(source);
        $("audioState").textContent = "playing";

        source.onended = () => {
          playbackSources.delete(source);
          if (!playbackSources.size) {
            $("audioState").textContent = "idle";
          }
        };
      }

      function floatToPcm16Buffer(input) {
        const pcm = new Int16Array(input.length);
        for (let i = 0; i < input.length; i += 1) {
          const value = Math.max(-1, Math.min(1, input[i]));
          pcm[i] = value < 0 ? value * 32768 : value * 32767;
        }
        return pcm.buffer;
      }

      async function sendStart(inputSampleRate = null) {
        if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error("WS not connected");
        if (sessionStarted) return;
        if (pendingStartPromise) return pendingStartPromise;

        const payload = { type: "start" };
        if (Number.isFinite(inputSampleRate) && inputSampleRate > 0) {
          payload.input_sample_rate = Math.round(inputSampleRate);
        }
        pendingStartPromise = new Promise((resolve, reject) => {
          resolvePendingStart = resolve;
          rejectPendingStart = reject;
        });
        ws.send(JSON.stringify(payload));
        return pendingStartPromise;
      }

      async function connect() {
        const url = $("wsUrl").value.trim();
        ws = new WebSocket(url);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          setStatus("ws connected");
          setButtons({ connected: true, started: false });
          log("WS open");
        };

        ws.onclose = async () => {
          resetPendingStart(new Error("WS closed"));
          sessionStarted = false;
          await stopLocalMicrophone();
          clearPlayback();
          setAudioRates();
          setStatus("offline");
          setButtons({ connected: false, started: false });
          log("WS closed");
        };

        ws.onerror = () => {
          log("WS error");
        };

        ws.onmessage = async (ev) => {
          if (typeof ev.data !== "string") {
            schedulePcmPlayback(ev.data);
            return;
          }

          let msg = null;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (!msg || !msg.type) return;

          if (msg.type === "started") {
            sessionStarted = true;
            outputSampleRate = msg.audio_output_sample_rate || 48000;
            await ensurePlaybackContext();
            setAudioRates({
              input: msg.input_sample_rate || "-",
              output: outputSampleRate,
            });
            setStatus("audio ready");
            setButtons({ connected: true, started: true });
            log(`audio started in=${msg.input_sample_rate || "n/a"} out=${outputSampleRate}`);
            if (resolvePendingStart) {
              resolvePendingStart(msg);
              resetPendingStart();
            }
            return;
          }

          if (msg.type === "stopped") {
            sessionStarted = false;
            clearPlayback();
            resetPendingStart(new Error("Audio stopped"));
            setAudioRates();
            setStatus("ws connected");
            setButtons({ connected: true, started: false });
            log("audio stopped");
            return;
          }

          if (msg.type === "transcript") {
            $("transcript").textContent = msg.text || "";
            $("intent").textContent = "";
            $("response").textContent = "";
            return;
          }

          if (msg.type === "response") {
            $("response").textContent += (msg.text || "");
            return;
          }

          if (msg.type === "tts_test") {
            $("ttsTestLog").textContent += (msg.text || "") + "\n";
            return;
          }

          if (msg.type === "intent") {
            $("intent").textContent = msg.intent || "";
            log("Intent: " + msg.intent);
            return;
          }

          if (msg.type === "vad") {
            log(`VAD ${msg.event} p=${msg.p ?? ""} samples=${msg.samples ?? ""}`);
            return;
          }

          if (msg.type === "tts_stop_now" || msg.type === "interrupted") {
            clearPlayback();
            log("TTS stop now");
            return;
          }

          if (msg.type === "interruption_decision") {
            log(`Interruption decision: ${msg.decision} elapsed_ms=${msg.elapsed_ms ?? ""} text=${msg.text ?? ""}`);
            return;
          }

          if (msg.type === "stt_empty") {
            log("STT: empty transcript");
            return;
          }

          if (msg.type === "error") {
            if (rejectPendingStart && String(msg.message || "").startsWith("start failed")) {
              rejectPendingStart(new Error(msg.message));
              resetPendingStart();
            }
            log("Server error: " + msg.message);
            return;
          }

          log("Server msg: " + ev.data);
        };
      }

      async function stopLocalMicrophone() {
        if (captureProcessor) {
          captureProcessor.onaudioprocess = null;
          try { captureProcessor.disconnect(); } catch {}
          captureProcessor = null;
        }
        if (captureSource) {
          try { captureSource.disconnect(); } catch {}
          captureSource = null;
        }
        if (captureSink) {
          try { captureSink.disconnect(); } catch {}
          captureSink = null;
        }
        if (micStream) {
          for (const track of micStream.getTracks()) track.stop();
          micStream = null;
        }
        if (captureContext) {
          try { await captureContext.close(); } catch {}
          captureContext = null;
        }
      }

      async function ensureMicrophoneStreaming() {
        if (captureProcessor) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error("WS not connected");

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false,
        });

        captureContext = new (window.AudioContext || window.webkitAudioContext)();
        await captureContext.resume();
        await sendStart(captureContext.sampleRate);

        captureSource = captureContext.createMediaStreamSource(micStream);
        captureProcessor = captureContext.createScriptProcessor(2048, 1, 1);
        captureSink = captureContext.createGain();
        captureSink.gain.value = 0;

        captureProcessor.onaudioprocess = (event) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          const input = event.inputBuffer.getChannelData(0);
          ws.send(floatToPcm16Buffer(input));
        };

        captureSource.connect(captureProcessor);
        captureProcessor.connect(captureSink);
        captureSink.connect(captureContext.destination);

        log(`mic streaming sr=${captureContext.sampleRate}`);
      }

      async function disconnect() {
        await stop();
        if (ws) {
          ws.close();
          ws = null;
        }
      }

      async function start() {
        $("transcript").textContent = "";
        $("intent").textContent = "";
        $("response").textContent = "";
        await ensurePlaybackContext();
        await ensureMicrophoneStreaming();
        setStatus("streaming mic");
      }

      async function testTts() {
        if (!ws || ws.readyState !== WebSocket.OPEN) throw new Error("WS not connected");
        const text = $("ttsTestText").value.trim();
        if (!text) throw new Error("Texte de test vide");

        await ensurePlaybackContext();
        if (!sessionStarted) {
          await sendStart();
        }

        $("ttsTestLog").textContent = "";
        log("TTS test sent");
        ws.send(JSON.stringify({ type: "test_tts", text }));
      }

      async function stop() {
        await stopLocalMicrophone();
        clearPlayback();
        sessionStarted = false;
        resetPendingStart(new Error("Audio stopped by client"));
        setAudioRates();

        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ type: "stop" })); } catch {}
          setStatus("ws connected");
          setButtons({ connected: true, started: false });
        } else {
          setStatus("offline");
          setButtons({ connected: false, started: false });
        }
      }

      $("connectBtn").onclick = () => connect().catch((e) => log(String(e)));
      $("disconnectBtn").onclick = () => disconnect().catch((e) => log(String(e)));
      $("startBtn").onclick = () => start().catch((e) => log(String(e)));
      $("stopBtn").onclick = () => stop().catch((e) => log(String(e)));
      $("testTtsBtn").onclick = () => testTts().catch((e) => log(String(e)));
    </script>
  </body>
</html>
